<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Steven Yang</title>
  <desc id="desc">Systems research and developer tools. Floating isometric storage layers with fine circuit traces and a brief pulse of data.</desc>
  <defs>
    <radialGradient id="pool">
      <stop stop-color="#007D8C" stop-opacity=".10"/>
      <stop offset="1" stop-color="#007D8C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
