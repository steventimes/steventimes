<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">fpstreams: lazy Python pipelines</title>
  <desc id="desc">Illustrative pipeline: read records with flow, filter and map them, then collect results. The ellipses stand for user-defined operations.</desc>
  <rect x=".5" y=".5" width="1199" height="229" rx="14" fill="#091426" stroke="#223957"/>
  <g font-family="'Trebuchet MS', 'Segoe UI', sans-serif"><text x="32" y="43" fill="#9FB4CE" font-size="18">PYTHON DATA PIPELINES</text>
    <rect x="32" y="71" width="360" height="83" rx="10" fill="#091426" stroke="#223957"/>
    <text x="52" y="122" fill="#EAF3FF" font-size="24" font-family="'Cascadia Code', Consolas, monospace">flow(records)</text>
    <text x="52" y="194" fill="#9FB4CE" font-size="20">Read records</text>
    <rect x="420" y="71" width="360" height="83" rx="10" fill="#091426" stroke="#223957"/>
    <text x="440" y="122" fill="#62D8E4" font-size="24" font-family="'Cascadia Code', Consolas, monospace">.filter(...).map(...)</text>
    <text x="440" y="194" fill="#9FB4CE" font-size="20">Filter and transform</text>
    <rect x="808" y="71" width="360" height="83" rx="10" fill="#091426" stroke="#223957"/>
    <text x="828" y="122" fill="#FFAD87" font-size="24" font-family="'Cascadia Code', Consolas, monospace">.collect(...)</text>
    <text x="828" y="194" fill="#9FB4CE" font-size="20">Collect results</text><path d="M 398 112 h 16 m -6 -6 6 6 -6 6" fill="none" stroke="#62D8E4" stroke-width="2"/><path d="M 786 112 h 16 m -6 -6 6 6 -6 6" fill="none" stroke="#62D8E4" stroke-width="2"/>
  </g>
</svg>
